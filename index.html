<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高股息 ETF 盤後動態監控儀表板</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; } 
        .card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); } 
        .table-dark { background-color: #1e1e1e; --bs-table-bg: #1e1e1e; font-size: 0.95rem; }
        .table th, .table td { padding: 14px 12px !important; vertical-align: middle; }
        .text-danger { color: #ff4d4d !important; font-weight: bold; } 
        .text-success { color: #00b300 !important; font-weight: bold; } 
        .nav-tabs { border-bottom: 2px solid #333; }
        .nav-tabs .nav-link { color: #aaa; border: none; padding: 14px 28px; font-weight: 500; font-size: 1.05rem; background: none; } 
        .nav-tabs .nav-link.active { background-color: #2a2a2a; color: #fff; border-bottom: 4px solid #0d6efd; border-radius: 6px 6px 0 0; }
        .fs-7 { font-size: 0.88rem; }
        .container { max-width: 1200px; }
    </style>
</head>
<body>
    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom border-secondary d-flex justify-content-between align-items-center">
            <h1 class="text-white fs-3 fw-bold">📊 高股息 ETF 盤後動態監控儀表板</h1>
            <span class="text-muted" id="update-time">最後更新時間：讀取中...</span>
        </header>
        
        <div class="row row-cols-1 row-cols-md-4 g-3 mb-4" id="cards-area"></div>
        
        <!-- 官方標準 Bootstrap 5 導覽分頁，100% 絕對能流暢切換、隔離表格 -->
        <ul class="nav nav-tabs mb-3" id="etfTabs" role="tablist">
            <li class="nav-item" role="presentation"><button class="nav-link active" id="t919-tab" data-bs-toggle="tab" data-bs-target="#p919" type="button" role="tab" aria-selected="true">00919 核心成分股</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" id="t56-tab" data-bs-toggle="tab" data-bs-target="#p56" type="button" role="tab" aria-selected="false">0056 核心成分股</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" id="t878-tab" data-bs-toggle="tab" data-bs-target="#p878" type="button" role="tab" aria-selected="false">00878 核心成分股</button></li>
        </ul>
        <div class="tab-content" id="etfTabsContent">
            <div class="tab-pane fade show active" id="p919" role="tabpanel"><div class="card shadow-sm"><div class="table-responsive"><table class="table table-dark table-striped table-hover mb-0"><thead><tr><th>排行</th><th>代號</th><th>股票名稱</th><th>持股權重</th><th>今日收盤</th><th>今日漲跌</th><th>今日成交量</th></tr></thead><tbody id="rows-919"></tbody></table></div></div></div>
            <div class="tab-pane fade" id="p56" role="tabpanel"><div class="card shadow-sm"><div class="table-responsive"><table class="table table-dark table-striped table-hover mb-0"><thead><tr><th>排行</th><th>代號</th><th>股票名稱</th><th>持股權重</th><th>今日收盤</th><th>今日漲跌</th><th>今日成交量</th></tr></thead><tbody id="rows-56"></tbody></table></div></div></div>
            <div class="tab-pane fade" id="p878" role="tabpanel"><div class="card shadow-sm"><div class="table-responsive"><table class="table table-dark table-striped table-hover mb-0"><thead><tr><th>排行</th><th>代號</th><th>股票名稱</th><th>持股權重</th><th>今日收盤</th><th>今日漲跌</th><th>今日成交量</th></tr></thead><tbody><tbody id="rows-878"></tbody></table></div></div></div>
        </div>
    </div>
    <script src="https://jsdelivr.net"></script>
    <script>
        const holdings = {
            "00919": [{code:"2881",name:"富邦金",weight:14.97},{code:"2882",name:"國泰金",weight:12.48},{code:"2891",name:"中信金",weight:10.12},{code:"2382",name:"廣達",weight:9.96},{code:"2887",name:"台新金",weight:8.85},{code:"2357",name:"華碩",weight:5.92},{code:"2883",name:"凱基金",weight:5.40},{code:"2603",name:"長榮",weight:3.83},{code:"3034",name:"聯詠",weight:3.31},{code:"2379",name:"瑞昱",weight:2.71}],
            "0056": [{code:"2454",name:"聯發科",weight:6.84},{code:"2317",name:"鴻海",weight:6.12},{code:"2382",name:"廣達",weight:5.24},{code:"2303",name:"聯電",weight:4.95},{code:"3231",name:"緯創",weight:4.61},{code:"2603",name:"長榮",weight:4.18},{code:"2357",name:"華碩",weight:3.95},{code:"3034",name:"聯詠",weight:3.42},{code:"2379",name:"瑞昱",weight:3.15},{code:"3711",name:"日月光投控",weight:2.88}],
            "00878": [{code:"2382",name:"廣達",weight:6.54},{code:"2301",name:"光寶科",weight:5.22},{code:"2324",name:"仁寶",weight:4.81},{code:"2891",name:"中信金",weight:4.42},{code:"2886",name:"兆豐金",weight:4.25},{code:"2882",name:"國泰金",weight:4.08},{code:"2881",name:"富邦金",weight:3.92},{code:"2357",name:"華碩",weight:3.71},{code:"3231",name:"緯創",weight:3.54},{code:"2303",name:"聯電",weight:3.38}]
        };
        async function loadData() {
            try {
                const res = await fetch('data.json?t=' + new Date().getTime());
                const raw = await res.json();
                document.getElementById('update-time').innerText = raw.update_time;
                
                const targets = [{name:"台灣加權指數",key:"^TWII",idx:true},{name:"00919 群益精選高息",key:"00919.TW",idx:false},{name:"0056 元大高股息",key:"0056.TW",idx:false},{name:"00878 國泰永續高股息",key:"00878.TW",idx:false}];
                let cHtml = "";
                targets.forEach(t => {
                    let d = raw[t.key] || {price:0,pct:0,vol:0};
                    const color = d.pct > 0 ? "text-danger" : (d.pct < 0 ? "text-success" : "text-muted");
                    cHtml += `<div class="col"><div class="card text-white shadow-sm"><div class="card-body"><h6 class="text-muted mb-2">${t.name}</h6><h3 class="fw-bold">${t.idx?d.price.toLocaleString(undefined,{maximumFractionDigits:2}):d.price.toFixed(2)+'元'}</h3><p class="mb-0 fs-7"><span class="${color}">${d.pct>=0?'+':''}${d.pct.toFixed(2)}%</span> | 量 ${t.idx?(d.vol/100000000).toFixed(1)+'億':(d.vol/1000).toLocaleString(undefined,{maximumFractionDigits:0})+'張'}</p></div></div></div>`;
                });
                document.getElementById('cards-area').innerHTML = cHtml;

                for (let etfId in holdings) {
                    let rHtml = "";
                    holdings[etfId].forEach((item, i) => {
                        let d = raw[item.code] || {price:0,pct:0,vol:0};
                        const color = d.pct > 0 ? "text-danger" : (d.pct < 0 ? "text-success" : "text-muted");
                        rHtml += `<tr><td>${(i+1).toString().padStart(2,'0')}</td><td>${item.code}</td><td><strong>${item.name}</strong></td><td class="text-info">${item.weight.toFixed(2)}%</td><td>${d.price>0?d.price.toFixed(2)+' 元':'休市中'}</td><td><span class="${color} fw-bold">${d.price>0?(d.pct>=0?'+':'')+d.pct.toFixed(2)+'%':'---'}</span></td><td>${d.price>0?(d.vol/1000).toLocaleString(undefined,{maximumFractionDigits:0})+' 張':'---'}</td></tr>`;
                    });
                    document.getElementById('rows-' + (etfId==="00919"?"919":(etfId==="0056"?"56":"878"))).innerHTML = rHtml;
                }
            } catch (e) { document.getElementById('update-time').innerText = "⚠️ 請前往 Actions 點擊 Run workflow 生成數據檔案"; }
        }
        window.onload = loadData;
    </script>
</body>
</html>
