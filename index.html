<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高股息 ETF 盤後動態監控儀表板</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; } 
        .card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); } 
        .table-dark { background-color: #1e1e1e; --bs-table-bg: #1e1e1e; font-size: 0.95rem; }
        .table th, .table td { padding: 14px 12px !important; vertical-align: middle; }
        .text-danger { color: #ff4d4d !important; font-weight: bold; } 
        .text-success { color: #00b300 !important; font-weight: bold; } 
        .nav-pills .nav-link { color: #aaa; background-color: #1e1e1e; border: 1px solid #444; padding: 12px 28px; margin-right: 12px; font-weight: bold; font-size: 1.05rem; transition: all 0.2s; }
        .nav-pills .nav-link.active { background-color: #0d6efd; color: #fff; border-color: #0d6efd; box-shadow: 0 2px 4px rgba(13,110,253,0.4); }
        .fs-7 { font-size: 0.88rem; }
        .container { max-width: 1200px; }
    </style>
</head>
<body>
    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom border-secondary d-flex justify-content-between align-items-center">
            <h1 class="text-white fs-3 fw-bold">📊 高股息 ETF 盤後動態監控儀表板</h1>
            <span class="text-muted" id="page-ut">正在連線安全金融數據源...</span>
        </header>
        
        <div class="row row-cols-1 row-cols-md-4 g-3 mb-4" id="cards-area"></div>
        
        <!-- 使用最頂級的 Pills 按鈕，由網頁端獨立切換，100% 表格絕不重疊 -->
        <div class="nav nav-pills mb-4" id="pills-tab" role="tablist">
            <button class="nav-link active" id="btn-919" data-bs-toggle="pill" type="button" onclick="switchETF('00919')">00919 核心成分股</button>
            <button class="nav-link" id="btn-56" data-bs-toggle="pill" type="button" onclick="switchETF('0056')">0056 核心成分股</button>
            <button class="nav-link" id="btn-878" data-bs-toggle="pill" type="button" onclick="switchETF('00878')">00878 核心成分股</button>
        </div>
        
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white fw-bold fs-5" id="table-title">00919 核心持股盤後行情明細</div>
            <div class="table-responsive">
                <table class="table table-dark table-striped table-hover mb-0">
                    <thead>
                        <tr style="background-color: #1a1a1a;">
                            <th>排行</th><th>代號</th><th>股票名稱</th><th>持股權重</th><th>今日收盤</th><th>今日漲跌</th><th>今日成交量</th>
                        </tr>
                    </thead>
                    <tbody id="main-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const holdings = {
            "00919": [
                {code:"2303", name:"聯電", weight:9.85}, {code:"2603", name:"長榮", weight:9.12}, {code:"2454", name:"聯發科", weight:8.55}, {code:"3034", name:"聯詠", weight:7.42}, {code:"2891", name:"中信金", weight:6.95}, {code:"2379", name:"瑞昱", weight:5.88}, {code:"2449", name:"京元電子", weight:5.12}, {code:"3231", name:"緯創", weight:4.65}, {code:"3711", name:"日月光投控", weight:4.10}, {code:"2382", name:"廣達", weight:3.95}
            ],
            "0056": [
                {code:"2454", name:"聯發科", weight:7.12}, {code:"2317", name:"鴻海", weight:6.85}, {code:"2303", name:"聯電", weight:5.42}, {code:"2603", name:"長榮", weight:4.95}, {code:"2382", name:"廣達", weight:4.50}, {code:"3231", name:"緯創", weight:4.12}, {code:"2357", name:"華碩", weight:3.88}, {code:"3034", name:"聯詠", weight:3.55}, {code:"2379", name:"瑞昱", weight:3.10}, {code:"3711", name:"日月光投控", weight:2.95}
            ],
            "00878": [
                {code:"2454", name:"聯發科", weight:5.22}, {code:"2382", name:"廣達", weight:4.85}, {code:"2891", name:"中信金", weight:4.62}, {code:"2324", name:"仁寶", weight:4.45}, {code:"2301", name:"光寶科", weight:4.21}, {code:"2886", "name":"兆豐金", weight:4.10}, {code:"2882", name:"國泰金", weight:3.95}, {code:"2881", name:"富邦金", weight:3.88}, {code:"2357", name:"華碩", weight:3.65}, {code:"3231", name:"緯創", weight:3.42}
            ]
        };

        let rawData = {};

        async function loadData() {
            try {
                const res = await fetch('data.json?t=' + new Date().getTime());
                rawData = await res.json();
                
                document.getElementById('page-ut').innerText = "最後更新時間：" + rawData.update_time;
                
                const targets = [
                    { name: "台灣加權指數", key: "^TWII", isIdx: true },
                    { name: "00919 群益精選高息", key: "00919.TW", isIdx: false },
                    { name: "0056 元大高股息", key: "0056.TW", isIdx: false },
                    { name: "00878 國泰永續高股息", key: "00878.TW", isIdx: false }
                ];
                let cardsHtml = "";
                targets.forEach(c => {
                    let d = rawData[c.key] || { price: 0, pct: 0, vol: 0 };
                    const sign = d.pct >= 0 ? "+" : "";
                    const color = d.pct > 0 ? "text-danger" : (d.pct < 0 ? "text-success" : "text-muted");
                    const pFmt = c.isIdx ? d.price.toLocaleString(undefined, {maximumFractionDigits:2}) : d.price.toFixed(2) + "元";
                    const vFmt = c.isIdx ? (d.vol / 100000000).toFixed(1) + "億" : (d.vol / 1000).toLocaleString() + "張";
                    
                    cardsHtml += `
                        <div class="col">
                            <div class="card text-white shadow-sm">
                                <div class="card-body">
                                    <h6 class="text-muted mb-2">${c.name}</h6>
                                    <h3 class="fw-bold">${pFmt}</h3>
                                    <p class="mb-0 fs-7"><span class="${color}">${sign}${d.pct.toFixed(2)}%</span> | 量 ${vFmt}</p>
                                </div>
                            </div>
                        </div>`;
                });
                document.getElementById('cards-area').innerHTML = cardsHtml;
                switchETF("00919");
            } catch (e) {
                document.getElementById('page-ut').innerText = "⚠️ 請前往 GitHub Actions 按下 Run workflow 生成初始真實數據檔";
            }
        }

        function switchETF(etfId) {
            document.querySelectorAll(".nav-link").forEach(b => b.classList.remove("active"));
            if(etfId === "00919") document.getElementById("btn-919").classList.add("active");
            if(etfId === "0056") document.getElementById("btn-56").classList.add("active");
            if(etfId === "00878") document.getElementById("btn-878").classList.add("active");

            document.getElementById("table-title").innerText = "🔥 " + etfId + " 核心持股收盤動態行情明細";
            
            const list = holdings[etfId];
            let rowsHtml = "";
            list.forEach((item, idx) => {
                let d = rawData[item.code] || { price: 0, pct: 0, vol: 0 };
                const sign = d.pct >= 0 ? "+" : "";
                const color = d.pct > 0 ? "text-danger" : (d.pct < 0 ? "text-success" : "text-muted");
                const priceTxt = d.price > 0 ? d.price.toFixed(2) + " 元" : "休市中";
                const changeTxt = d.price > 0 ? `<span class="${color} fw-bold">${sign}${d.pct.toFixed(2)}%</span>` : "---";
                const volTxt = d.price > 0 ? (d.vol / 1000).toLocaleString(undefined, {maximumFractionDigits:0}) + " 張" : "---";
                
                rowsHtml += `<tr>
                    <td>${(idx+1).toString().padStart(2, '0')}</td>
                    <td>${item.code}</td>
                    <td><strong>${item.name}</strong></td>
                    <td class="text-info">${item.weight.toFixed(2)}%</td>
                    <td>${priceTxt}</td>
                    <td>${changeTxt}</td>
                    <td>${volTxt}</td>
                </tr>`;
            });
            document.getElementById("main-table-body").innerHTML = rowsHtml;
        }

        window.onload = loadData;
    </script>
</body>
</html>
