name: 每日自動更新台股盤後大儀表板

on:
  schedule:
    - cron: '35 7 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 檢查程式碼
      uses: actions/checkout@v3

    - name: 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安裝金融下載套件
      run: pip install yfinance pytz requests pandas

    - name: 執行資料抓取
      run: python update.py

    - name: 自動推送到儲存庫
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "全自動更新當日真實文字數據" && git push)
